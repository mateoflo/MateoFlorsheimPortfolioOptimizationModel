<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="520" fill="#FFFFFF"/>
  <text x="60.00" y="44.00" text-anchor="start" fill="#1E293B" font-family="Helvetica Neue,Arial,sans-serif" font-size="20" font-weight="700">Model Upgrade Roadmap</text>
  <text x="60.00" y="66.00" text-anchor="start" fill="#475569" font-family="Helvetica Neue,Arial,sans-serif" font-size="13" font-weight="normal">Research-driven path for improving expected-return calibration and out-of-sample credibility</text>
  <line x1="130" y1="280" x2="1120" y2="280" stroke="#CBD5E1" stroke-width="3"/>
  <circle cx="160" cy="280" r="22" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="3"/>
  <text x="160.00" y="286.00" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue,Arial,sans-serif" font-size="15" font-weight="700">1</text>
  <text x="160.00" y="234.00" text-anchor="middle" fill="#1E293B" font-family="Helvetica Neue,Arial,sans-serif" font-size="13" font-weight="700">Black-Litterman Core</text>
  <text x="160.00" y="332.00" text-anchor="middle" fill="#475569" font-family="Helvetica Neue,Arial,sans-serif" font-size="11" font-weight="normal">Anchor expected-return</text>
  <text x="160.00" y="350.00" text-anchor="middle" fill="#475569" font-family="Helvetica Neue,Arial,sans-serif" font-size="11" font-weight="normal">estimates in equilibrium</text>
  <text x="160.00" y="368.00" text-anchor="middle" fill="#475569" font-family="Helvetica Neue,Arial,sans-serif" font-size="11" font-weight="normal">priors (Black &amp; Litterman 1992)</text>
  <text x="160.00" y="386.00" text-anchor="middle" fill="#475569" font-family="Helvetica Neue,Arial,sans-serif" font-size="11" font-weight="normal">for better calibration.</text>
  <circle cx="420" cy="280" r="22" fill="#0F766E" stroke="#FFFFFF" stroke-width="3"/>
  <text x="420.00" y="286.00" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue,Arial,sans-serif" font-size="15" font-weight="700">2</text>
  <text x="420.00" y="234.00" text-anchor="middle" fill="#1E293B" font-family="Helvetica Neue,Arial,sans-serif" font-size="13" font-weight="700">Factor Priors</text>
  <text x="420.00" y="332.00" text-anchor="middle" fill="#475569" font-family="Helvetica Neue,Arial,sans-serif" font-size="11" font-weight="normal">Incorporate Fama–French</text>
  <text x="420.00" y="350.00" text-anchor="middle" fill="#475569" font-family="Helvetica Neue,Arial,sans-serif" font-size="11" font-weight="normal">risk factors to stabilize</text>
  <text x="420.00" y="368.00" text-anchor="middle" fill="#475569" font-family="Helvetica Neue,Arial,sans-serif" font-size="11" font-weight="normal">expected-return estimates</text>
  <text x="420.00" y="386.00" text-anchor="middle" fill="#475569" font-family="Helvetica Neue,Arial,sans-serif" font-size="11" font-weight="normal">(Fama &amp; French 1993).</text>
  <circle cx="680" cy="280" r="22" fill="#7C3AED" stroke="#FFFFFF" stroke-width="3"/>
  <text x="680.00" y="286.00" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue,Arial,sans-serif" font-size="15" font-weight="700">3</text>
  <text x="680.00" y="234.00" text-anchor="middle" fill="#1E293B" font-family="Helvetica Neue,Arial,sans-serif" font-size="13" font-weight="700">Robust Bayesian Layer</text>
  <text x="680.00" y="332.00" text-anchor="middle" fill="#475569" font-family="Helvetica Neue,Arial,sans-serif" font-size="11" font-weight="normal">Apply Meucci's robust</text>
  <text x="680.00" y="350.00" text-anchor="middle" fill="#475569" font-family="Helvetica Neue,Arial,sans-serif" font-size="11" font-weight="normal">Bayesian allocation to</text>
  <text x="680.00" y="368.00" text-anchor="middle" fill="#475569" font-family="Helvetica Neue,Arial,sans-serif" font-size="11" font-weight="normal">damp estimation noise</text>
  <text x="680.00" y="386.00" text-anchor="middle" fill="#475569" font-family="Helvetica Neue,Arial,sans-serif" font-size="11" font-weight="normal">(Meucci 2005).</text>
  <circle cx="940" cy="280" r="22" fill="#D97706" stroke="#FFFFFF" stroke-width="3"/>
  <text x="940.00" y="286.00" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue,Arial,sans-serif" font-size="15" font-weight="700">4</text>
  <text x="940.00" y="234.00" text-anchor="middle" fill="#1E293B" font-family="Helvetica Neue,Arial,sans-serif" font-size="13" font-weight="700">Next Research Phase</text>
  <text x="940.00" y="332.00" text-anchor="middle" fill="#475569" font-family="Helvetica Neue,Arial,sans-serif" font-size="11" font-weight="normal">Benchmark vs. 1/N</text>
  <text x="940.00" y="350.00" text-anchor="middle" fill="#475569" font-family="Helvetica Neue,Arial,sans-serif" font-size="11" font-weight="normal">(DeMiguel et al. 2009);</text>
  <text x="940.00" y="368.00" text-anchor="middle" fill="#475569" font-family="Helvetica Neue,Arial,sans-serif" font-size="11" font-weight="normal">tighten constraints</text>
  <text x="940.00" y="386.00" text-anchor="middle" fill="#475569" font-family="Helvetica Neue,Arial,sans-serif" font-size="11" font-weight="normal">(Jagannathan &amp; Ma 2003).</text>
  <text x="600.00" y="500.00" text-anchor="middle" fill="#475569" font-family="Helvetica Neue,Arial,sans-serif" font-size="10" font-weight="normal">Source references: Black &amp; Litterman (1992), Fama &amp; French (1993), Meucci (2005), Jagannathan &amp; Ma (2003), DeMiguel, Garlappi &amp; Uppal (2009).</text>
</svg>
