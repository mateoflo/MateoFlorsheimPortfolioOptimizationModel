  <line x1="80.00" y1="131.43" x2="900.00" y2="131.43" stroke="#E2E8F0" stroke-width="1"/>
  <text x="72.00" y="135.43" text-anchor="end" fill="#475569" font-family="Helvetica Neue,Arial,sans-serif" font-size="12" font-weight="normal">100%</text>
