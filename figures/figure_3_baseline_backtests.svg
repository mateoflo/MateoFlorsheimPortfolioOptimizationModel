  <text x="490.00" y="582.00" text-anchor="middle" fill="#1E293B" font-family="Helvetica Neue,Arial,sans-serif" font-size="14" font-weight="700">Run 2</text>
  <text x="490.00" y="600.00" text-anchor="middle" fill="#475569" font-family="Helvetica Neue,Arial,sans-serif" font-size="12" font-weight="normal">9,997 portfolios / 20 tickers</text>
  <rect x="414.93" y="518.78" width="71.07" height="41.22" fill="#1D4ED8" rx="3"/>
