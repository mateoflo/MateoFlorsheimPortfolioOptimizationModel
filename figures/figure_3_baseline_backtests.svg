  <rect x="767.33" y="200.54" width="71.07" height="359.46" fill="#16A34A" rx="3"/>
  <text x="802.87" y="192.54" text-anchor="middle" fill="#16A34A" font-family="Helvetica Neue,Arial,sans-serif" font-size="14" font-weight="700">79.9%</text>
  <rect x="560.00" y="115.00" width="13" height="13" rx="2" fill="#1D4ED8"/>
  <text x="579.00" y="125.00" text-anchor="start" fill="#1E293B" font-family="Helvetica Neue,Arial,sans-serif" font-size="12" font-weight="normal">Prediction accuracy (realized ≥ expected)</text>
  <rect x="560.00" y="137.00" width="13" height="13" rx="2" fill="#16A34A"/>
  <text x="579.00" y="147.00" text-anchor="start" fill="#1E293B" font-family="Helvetica Neue,Arial,sans-serif" font-size="12" font-weight="normal">Profitable (positive realized return)</text>
  <text x="490.00" y="628.00" text-anchor="middle" fill="#475569" font-family="Helvetica Neue,Arial,sans-serif" font-size="12" font-weight="normal">Profitability was consistently higher than formal accuracy, driven by overly optimistic return forecasts.</text>
