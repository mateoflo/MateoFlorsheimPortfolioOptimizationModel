  <text x="80.00" y="58.00" text-anchor="start" fill="#475569" font-family="Helvetica Neue,Arial,sans-serif" font-size="13" font-weight="normal">Prediction accuracy vs. profitability rate across the first three out-of-sample experiments</text>
  <text x="80.00" y="76.00" text-anchor="start" fill="#475569" font-family="Helvetica Neue,Arial,sans-serif" font-size="13" font-weight="normal">Accuracy = realized ≥ expected return. Profitability = portfolio finished positive.</text>
